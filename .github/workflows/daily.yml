name: Tech News Agent

on:
  schedule:
    - cron: '30 0 * * *' # 北京时间早上 8:30 运行
  workflow_dispatch:

jobs:
  run_agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install feedparser google-generativeai requests
      - name: Run Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PUSH_URL: ${{ secrets.PUSH_URL }}
        run: python main.py
