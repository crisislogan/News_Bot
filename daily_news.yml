name: Daily News Bot

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间早上 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮触发，方便测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 执行新闻脚本
      env:
        # 将你在 GitHub Secrets 里存的密钥映射给脚本
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python main.py
